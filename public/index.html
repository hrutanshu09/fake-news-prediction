<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Fake News Predictor</h1>
        <p>Enter the title of a news article to check if it's real or fake.</p>
        <textarea id="newsText" placeholder="Enter news title here..."></textarea>
        <button id="predictBtn">Predict</button>
        <div id="result"></div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
